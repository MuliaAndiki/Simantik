name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simantikApi

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: simantikApi/go.mod
          cache: true
          cache-dependency-path: simantikApi/go.sum

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Go Tests
        run: go test -v -race ./...

  frontend-test:
    name: Frontend Tests & Quality (Bun + Biome)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      SKIP_ENV_VALIDATION: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: "production"
      AUTH_SECRET_KEY: "simantik-ci-dummy-auth-secret-key-min-32-chars"
      NEXT_INTERNAL_API_SECRET: "simantik-ci-dummy-internal-api-secret"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080"
      NEXT_PUBLIC_BASEPATH: "/home"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Check (Formatting & Linting)
        run: bun run check

      - name: Run Bun Unit Tests
        run: bun test

      - name: Next.js Production Build Check
        run: bun run build
