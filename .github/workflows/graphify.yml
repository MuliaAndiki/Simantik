name: Graphify Knowledge Graph

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  graphify:
    name: Generate & Upload Knowledge Graph
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          pip install graphifyy

      - name: Extract Knowledge Graph (AST)
        run: |
          # Deterministic AST code extraction (Go + TypeScript/React) without requiring paid API keys
          graphify extract . --code-only
          # Generate interactive HTML visualization and hierarchy tree
          graphify export html || true
          graphify tree || true

      - name: Upload Graphify Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simantik-knowledge-graph
          path: graphify-out/
          retention-days: 30
