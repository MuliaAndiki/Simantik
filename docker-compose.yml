name: simantik-stack

services:
  # ============================================================================
  # NGINX Load Balancer (Reverse Proxy)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: simantik-load-balancer
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      web-1:
        condition: service_healthy
      web-2:
        condition: service_healthy
    networks:
      - simantik-network

  # ============================================================================
  # Backend API - Instance 1 (Go Fiber)
  # ============================================================================
  api-1:
    build:
      context: ./simantikApi
      dockerfile: Dockerfile
    container_name: simantik-api-1
    restart: unless-stopped
    env_file:
      - ./simantikApi/.env
    environment:
      - APP_PORT=8080
      - INSTANCE_ID=simantik-api-1
      - DB_HOST=postgres
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=simantik-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_INSECURE=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - simantik-network

  # ============================================================================
  # Backend API - Instance 2 (Go Fiber)
  # ============================================================================
  api-2:
    build:
      context: ./simantikApi
      dockerfile: Dockerfile
    container_name: simantik-api-2
    restart: unless-stopped
    env_file:
      - ./simantikApi/.env
    environment:
      - APP_PORT=8080
      - INSTANCE_ID=simantik-api-2
      - DB_HOST=postgres
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=simantik-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_INSECURE=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      jaeger:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - simantik-network

  # ============================================================================
  # Frontend Web - Instance 1 (Next.js)
  # ============================================================================
  web-1:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: simantik-web-1
    restart: unless-stopped
    env_file:
      - ./web/.env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - INSTANCE_ID=simantik-web-1
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - simantik-network

  # ============================================================================
  # Frontend Web - Instance 2 (Next.js)
  # ============================================================================
  web-2:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: simantik-web-2
    restart: unless-stopped
    env_file:
      - ./web/.env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - INSTANCE_ID=simantik-web-2
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost}
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - simantik-network

  # ============================================================================
  # OpenTelemetry Tracing Backend & Web UI (Jaeger)
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: simantik-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - simantik-network

  # ============================================================================
  # Database - PostgreSQL (Fallback / Local Dev / Staging)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: simantik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-simantik_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - simantik-network

# ==============================================================================
# Networks & Volumes
# ==============================================================================
networks:
  simantik-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
